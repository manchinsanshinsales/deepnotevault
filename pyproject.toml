[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepnotevault"
version = "0.1.0"
description = "Privacy-first local NotebookLM alternative powered by local LLM"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PySide6>=6.7.0",
    "llama-index-core>=0.11.0",
    "llama-index-readers-file>=0.2.0",
    "llama-index-vector-stores-chroma>=0.2.0",
    "llama-index-llms-ollama>=0.3.0",
    "llama-index-embeddings-ollama>=0.3.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
deepnotevault = "deepnotevault.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepnotevault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
